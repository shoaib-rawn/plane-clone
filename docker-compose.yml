services:
  db:
    image: postgres:16-alpine
    container_name: miniplane-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: miniplane ${POSTGRES_USER}
      POSTGRES_PASSWORD: localdev ${POSTGRES_PASSWORD}
      POSTGRES_DB: miniplane ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432 #Port 5433 on purpose: avoids conflicts with the local Postgres
    volumes:
      - miniplane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniplane"]
      interval: 5s
      retries: 5

volumes:
  miniplane_pgdata:
